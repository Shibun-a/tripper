server:
  port: 8747

spring:
  messages:
    basename: messages
    encoding: UTF-8
    # On a zh_CN machine, default true makes missing-key/locale lookups fall back to the
    # system locale (Chinese) instead of the default English bundle. Disable so en works.
    fallback-to-system-locale: false
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false
      # additional-paths: src/main/resources/templates
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'

embabel:
  security:
    enabled: false

  # Add additional MCP tools
  agent:
    platform:
      tools:
        includes:
          weather:
            description: Get the current weather and forecast for any location
            provider: Docker
            tools:
              - weather
          # Map the flat tools from the Docker MCP gateway to the CoreToolGroups roles the
          # agent calls (CoreToolGroups.WEB = "web", CoreToolGroups.MAPS = "maps"), so
          # withTools(WEB/MAPS) resolves to real gateway tools instead of an empty group.
          web:
            description: Search the web with Brave
            provider: Docker
            tools:
              - brave_web_search
          maps:
            description: Google Maps geocoding, places, directions and distances
            provider: Docker
            tools:
              - maps_geocode
              - maps_reverse_geocode
              - maps_search_places
              - maps_place_details
              - maps_distance_matrix
              - maps_elevation
              - maps_directions

  tripper:
    word-count: 600
    image-width: 850
    max-concurrency: 4
    observability:
      enabled: true
      capture-prompt-content: false
      max-summary-characters: 240
      max-runs: 100
      cost-warning-threshold-usd: 0.15
    safety:
      tools:
        enabled: true
        max-tool-calls-per-action: 8
        high-risk-tool-groups:
          - browser
          - browser_automation
          - airbnb

    # Anthropic models will give better results but are more expensive
    thinker-llm:
      model: claude-sonnet-4-5

    researcher:
      persona:
        role: Researcher
        goal: Research points of interest for a travel plan
        backstory: >
          You are an expert researcher who can find interesting stories about art, culture, 
          and famous people associated with places
      llm:
        model: claude-haiku-4-5


    planner:
      persona:
        name: Hermes
        persona: You are an expert travel planner
        voice: friendly and concise
        objective: Help the user plan an amazing trip, considering their requirements and preferences
      llm:
        model: claude-sonnet-4-5


logging:
  pattern:
    console: '%clr(%d{HH:mm:ss.SSS}){faint} %clr([%t]){magenta} %clr(%-5level) %clr(%logger{0}){cyan} %clr(-){faint} %msg%n'
  level:
    com.embabel.agent.core.ActionRunner: DEBUG
    com.embabel.agent.config.models.DockerLocalModels: DEBUG
    com.embabel.agent.web.sse.SSEController: INFO
    com.embabel.agent.tools.mcp: DEBUG
