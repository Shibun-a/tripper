<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${travelPlan.proposal.title}">Embabel Journey Planner</title>
    <th:block th:fragment="extraHeadContent">
        <script src="https://unpkg.com/htmx.org@2.0.5"></script>
    </th:block>
</head>
<body>
<section>
    <div th:if="${travelPlan != null}">
        <h2 th:text="${travelPlan.proposal.title}"></h2>

        <div style="margin-bottom: 20px;">
            <a href="/travel/journey" target="_blank" rel="noopener noreferrer"
               class="submit-btn" th:text="#{result.planAnother}">
                Plan Another Journey
            </a>
            <a th:if="${agentProcess != null}" th:href="@{/runs/{id}(id=${agentProcess.id})}"
               class="submit-btn" style="margin-left: 0.5rem;" th:text="#{result.inspectTrace}">
                Inspect Run Trace
            </a>
            <a th:if="${agentProcess != null}" th:href="@{/plans/{id}/edit(id=${agentProcess.id})}"
               class="submit-btn" style="margin-left: 0.5rem;" th:text="#{result.editPlan}">
                Edit This Plan
            </a>
        </div>


        <div th:if="${travelPlan.brief != null}">
            <h3 th:text="#{result.brief}">Brief</h3>
            <p style="margin-bottom: 0.75rem;"
               th:text="#{result.briefRoute(${travelPlan.brief.from}, ${travelPlan.brief.to}, ${#temporals.format(travelPlan.brief.departureDate, 'dd MMM yyyy')}, ${#temporals.format(travelPlan.brief.returnDate, 'dd MMM yyyy')})}">From A to B from C to D</p>
            <i style="margin-bottom: 1rem; display:block;">[[${travelPlan.brief.brief}]]</i>

            <ul class="travelers-list">
                <li th:each="traveler : ${travelPlan.travelers.travelers}">
                    <strong th:text="${traveler.name}"></strong>
                    <p th:text="${traveler.about}"></p>
                </li>
            </ul>

            <h3 th:text="#{result.plan}">Plan</h3>
            <div style="margin-bottom: 20px;">
                <a th:href="${travelPlan.journeyMapUrl}" target="_blank" rel="noopener noreferrer"
                   class="submit-btn" th:text="#{result.interactiveMap}">
                    Interactive Map
                </a>
            </div>

            <div th:utext="${travelPlan.proposal.plan}" style="margin-bottom: 1rem;"></div>

            <div th:if="${travelPlan.verificationResult != null}" style="margin-bottom: 1.5rem;">
                <h3 th:text="#{result.verification}">Verification</h3>
                <p style="margin-bottom: 0.5rem;">
                    <strong th:text="#{result.status}">Status:</strong>
                    <span th:text="${travelPlan.verificationResult.status}"></span>
                    <span th:if="${travelPlan.verificationResult.repaired}"
                          style="margin-left: 0.75rem;" th:text="#{result.repaired}">Repaired before final display</span>
                </p>
                <p th:text="${travelPlan.verificationResult.summary}" style="margin-bottom: 0.75rem;"></p>

                <ul th:if="${travelPlan.verificationResult.hasIssues}" style="margin-bottom: 1rem;">
                    <li th:each="issue : ${travelPlan.verificationResult.issues}" style="margin-bottom: 0.5rem;">
                        <strong>
                            <span th:text="${issue.severity}"></span>
                            <span th:text="${issue.category}"></span>
                        </strong>
                        <span th:text="${issue.message}"></span>
                        <small th:if="${issue.details != null}" th:text="${issue.details}"
                               style="display: block;"></small>
                    </li>
                </ul>

                <div th:if="${travelPlan.verificationResult.routeEstimates != null && !#lists.isEmpty(travelPlan.verificationResult.routeEstimates)}">
                    <h4 th:text="#{result.routeEstimates}">Route Estimates</h4>
                    <ul style="margin-bottom: 1rem;">
                        <li th:each="leg : ${travelPlan.verificationResult.routeEstimates}"
                            style="margin-bottom: 0.35rem;">
                            <span th:text="${leg.fromLocation + ' -> ' + leg.toLocation}"></span>
                            <span th:if="${leg.distanceKm != null}"
                                  th:text="${' approx ' + #numbers.formatDecimal(leg.distanceKm, 1, 0) + ' km'}"></span>
                            <span th:if="${leg.estimatedHours != null}"
                                  th:text="${' / ' + #numbers.formatDecimal(leg.estimatedHours, 1, 1) + ' h'}"></span>
                        </li>
                    </ul>
                </div>
            </div>

            <div th:if="${travelPlan.knowledgeContext != null && travelPlan.knowledgeContext.hasHits}">
                <h3 th:text="#{result.knowledgeSources}">Knowledge Sources Used</h3>
                <ol>
                    <li th:each="hit : ${travelPlan.knowledgeContext.hits}" style="margin-bottom: 0.5rem;">
                        <strong th:text="${hit.citationId}"></strong>
                        <span th:text="' score=' + ${#numbers.formatDecimal(hit.score, 1, 3)}"></span>
                        <p th:text="${hit.text}"></p>
                        <small th:text="${hit.source}"></small>
                    </li>
                </ol>
            </div>

            <h3 th:text="#{result.stays}">Stays</h3>
            <ul style="margin-bottom: 1rem;">
                <li th:each="stay : ${travelPlan.stays}" style="margin-bottom: 0.5rem;">
                    <a th:href="${stay.airbnbUrl}" target="_blank" rel="noopener noreferrer"><span
                            th:text="#{result.stayOnAirbnb(${stay.stayingAt()}, ${stay.days.size()})}"></span></a>
                </li>
            </ul>

            <div th:if="${travelPlan.proposal.pageLinks != null && !#lists.isEmpty(travelPlan.proposal.pageLinks)}">
                <h3 th:text="#{result.usefulLinks}">Useful Links</h3>
                <ul style="margin-bottom: 1rem;">
                    <li th:each="page : ${travelPlan.proposal.pageLinks}" style="margin-bottom: 0.5rem;">
                        <a th:href="${page.url}" target="_blank" rel="noopener noreferrer"><span
                                th:text="${page.summary}"></span></a>
                    </li>
                </ul>
            </div>
            <div th:if="${travelPlan.proposal.videoLinks != null && !#lists.isEmpty(travelPlan.proposal.videoLinks)}">
                <h3 th:text="#{result.videos}">Videos</h3>
                <ul style="margin-bottom: 1rem;">
                    <li th:each="page : ${travelPlan.proposal.videoLinks}" style="margin-bottom: 0.5rem;">
                        <a th:href="${page.url}" target="_blank" rel="noopener noreferrer"><span
                                th:text="${page.summary}"></span></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <hr class="dotted"/>
    <div id="currenxt-plan" th:replace="~{common/fragments/plan-complete :: plan-complete}"></div>
</section>
</body>
</html>
