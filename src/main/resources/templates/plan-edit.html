<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${editSession.title}">Edit Travel Plan</title>
</head>
<body>
<section>
    <h2 th:text="${editSession.title}"></h2>

    <p>
        <a th:href="@{/runs/{id}(id=${editSession.runId})}">Run trace</a>
        <span style="margin: 0 0.5rem;">/</span>
        <a href="/travel/journey">Planner</a>
    </p>

    <h3>Constraints</h3>
    <p th:text="${editSession.fromLocation + ' -> ' + editSession.toLocation + ' / ' + editSession.transportPreference}"></p>
    <p th:text="${editSession.departureDate + ' to ' + editSession.returnDate + ' / daily budget $' + #numbers.formatDecimal(editSession.dailyBudget, 1, 0)}"></p>
    <p th:text="${editSession.constraintsSummary}"></p>

    <h3>Edit</h3>
    <form th:action="@{/plans/{id}/edit(id=${editSession.runId})}" th:object="${editForm}" method="post"
          style="margin-bottom: 1.5rem;">
        <label for="selectedDate">Scope</label>
        <select id="selectedDate" th:field="*{selectedDate}">
            <option value="all">All days</option>
            <option th:each="day : ${editSession.latestVersion().days()}"
                    th:value="${day.date()}"
                    th:text="${day.date() + ' - ' + day.stayingAt()}"></option>
        </select>

        <label for="instruction">Instruction</label>
        <textarea id="instruction" th:field="*{instruction}" rows="4"
                  placeholder="Keep the first two days, but make the rest cheaper."></textarea>

        <button type="submit" class="submit-btn">Apply Edit</button>
    </form>

    <h3>Latest Version</h3>
    <p>
        <strong>Version:</strong>
        <span th:text="${editSession.latestVersion().versionNumber()}"></span>
        <span style="margin-left: 0.75rem;"><strong>Verification:</strong></span>
        <span th:text="${editSession.latestVersion().verificationResult().status}"></span>
    </p>
    <p th:text="${editSession.latestVersion().verificationResult().summary}"></p>

    <div th:if="${editSession.latestVersion().diff().hasChanges()}" style="margin-bottom: 1.5rem;">
        <h3>Diff</h3>
        <p th:text="${editSession.latestVersion().diff().summary()}"></p>
        <ul>
            <li th:each="change : ${editSession.latestVersion().diff().changes()}">
                <strong th:text="${change.date() == null ? 'Global' : change.date()}"></strong>
                <span th:text="${' before: ' + change.beforeValue()}"></span>
                <span th:text="${' after: ' + change.afterValue()}"></span>
            </li>
        </ul>
    </div>

    <h3>Days</h3>
    <table style="width: 100%; margin-bottom: 1.5rem;">
        <thead>
        <tr>
            <th style="text-align: left;">Date</th>
            <th style="text-align: left;">Location</th>
            <th style="text-align: left;">Edit Note</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="day : ${editSession.latestVersion().days()}">
            <td th:text="${day.date()}"></td>
            <td th:text="${day.locationAndCountry()}"></td>
            <td th:text="${day.editNote() == null ? '' : day.editNote()}"></td>
        </tr>
        </tbody>
    </table>

    <h3>Plan</h3>
    <div th:utext="${editSession.latestVersion().planHtml()}"></div>

    <h3>Versions</h3>
    <ul>
        <li th:each="version : ${editSession.versions}"
            th:text="${'v' + version.versionNumber() + ' - ' + version.instruction() + ' - ' + version.verificationResult().status}"></li>
    </ul>
</section>
</body>
</html>
